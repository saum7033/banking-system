name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d banking"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Account Service
      run: mvn -B package --file account-service/pom.xml
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/banking
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres

    - name: Build Transaction Service
      run: mvn -B package --file transaction-service/pom.xml
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/banking
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: postgres
